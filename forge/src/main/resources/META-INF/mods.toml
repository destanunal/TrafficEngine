modLoader = "javafml"
loaderVersion = "[${forge_loader_version},)"
license = "${license}"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${display_name}"
displayUrl="[https://github.com/destan]"
authors = "${authors}"
credits="This mod is inspired by TrafficCraft."
description = '''${description}'''
logoFile = "${icon}"

[[dependencies.${modid}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_dependency_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},${next_unsupported_minecraft_version})"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "dragonlib"
mandatory = true
versionRange = "[beta-3.0.19,)"
ordering = "BEFORE"
side = "BOTH"