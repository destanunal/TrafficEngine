name: Upload one Traffic Engine distribution

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      minecraft:
        required: true
        type: string
      loader:
        required: true
        type: string
      destinations:
        required: true
        type: string
    secrets:
      CURSEFORGE_TOKEN:
        required: false
      MODRINTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload ${{ inputs.minecraft }} ${{ inputs.loader }} to ${{ matrix.destination }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        destination: ${{ fromJSON(inputs.destinations) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: release-plan
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trafficengine-${{ inputs.version }}-${{ inputs.minecraft }}
          path: release-input
          digest-mismatch: error
      - name: Recheck the exact distribution before uploading
        id: distribution
        env:
          MINECRAFT: ${{ inputs.minecraft }}
          LOADER: ${{ inputs.loader }}
        run: >-
          python3 -B .github/release/release.py verify
          --directory release-input --plan release-plan/plan.json
          --minecraft "$MINECRAFT" --loader "$LOADER"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Upload this file to the selected site
        env:
          DESTINATION: ${{ matrix.destination }}
          MINECRAFT: ${{ inputs.minecraft }}
          LOADER: ${{ inputs.loader }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_ARCHIVE: ${{ steps.distribution.outputs.artifact }}
          CURSEFORGE_TOKEN: ${{ matrix.destination == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          MODRINTH_TOKEN: ${{ matrix.destination == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
        run: |
          bash ./gradlew --project-dir .github/release publishMods --no-daemon --stacktrace \
            "-Pdestination=$DESTINATION" "-Pminecraft=$MINECRAFT" "-Ploader=$LOADER" \
            "-PreleaseVersion=$RELEASE_VERSION" "-PreleaseChannel=$RELEASE_CHANNEL" \
            "-PartifactPath=$RELEASE_ARCHIVE" "-PchangelogPath=$GITHUB_WORKSPACE/release-plan/changelog.md"
