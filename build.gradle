plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id "net.mrjulsen.mod-build-tools" version "1.0.15"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply from: rootProject.file('gradle/compact-jars.gradle')

    configurations.configureEach {
        if (rootProject.hasProperty("lwjgl_version")) {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.lwjgl") {
                    details.useVersion rootProject.lwjgl_version
                }
            }
        }
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url = file("${System.getProperty('user.home')}/.m2/github/modsrepo/maven/") } // Local
        maven { url = "https://maven.mrjulsen.net" } // DragonLib
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
        maven { url = "https://api.modrinth.com/maven" } // Modrinth
        maven { url = "https://cursemaven.com" } // CurseForge
        maven { url = "https://jitpack.io/" } // Mixin Extras, Fabric ASM
        maven { url = "https://maven.parchmentmc.org" } // ParchmentMC
        maven { url = "https://maven.terraformersmc.com/" } // ModMenu
        maven { url = "https://maven.blamejared.com" } // Embeddium
        maven { url = "https://maven.neoforged.net/releases/" } // NeoForge
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    processResources {
        def expandProps = [
            "version": version,
            "minecraft_version": rootProject.minecraft_version,
            "license": rootProject.license,
            "modid": rootProject.archives_name,
            "display_name": rootProject.display_name,
            "modpage": rootProject.modpage,
            "authors": rootProject.authors,
            "description": rootProject.description,
            "next_unsupported_minecraft_version": rootProject.next_unsupported_minecraft_version,
            "dragonlib_version": "$rootProject.minecraft_version-$rootProject.dragonlib_version",
            "architectury_api_version": rootProject.architectury_api_version,
            "forge_config_api_port_version": rootProject.forge_config_api_port_version,
            "neoforge_dependency_version": rootProject.neoforge_dependency_version,
            "fabric_loader_version": rootProject.fabric_loader_version,
            "java_version": rootProject.java_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand expandProps
        }
        inputs.properties(expandProps)
        exclude ".cache" // Remove cache from generated data
        // The obsolete editor sheet is not a runtime asset.
        exclude "assets/trafficengine/textures/gui/icons-old.png"
        // Unreferenced 1x1 texture forced the entire block atlas to mip level 0.
        exclude "assets/trafficengine/textures/block/road_paint_solid.png"
        // Pattern overlays contain the same geometry and tint data for every
        // road material. The material's base is rendered by a separate model,
        // so one shared overlay avoids baking six redundant copies in memory.
        def sharedOverlayRoads = 'concrete|cracked_asphalt|heavy_cracked_asphalt|light_asphalt|dark_asphalt|dirty_asphalt'
        exclude { details ->
            details.path ==~ /assets\/trafficengine\/models\/block\/(?:${sharedOverlayRoads})(?:\/\d+|\/slope\/\d+_\d+)\.json/
        }
        doFirst {
            // Copy tasks do not remove files that were produced by older builds.
            def modelRoot = new File(destinationDir, 'assets/trafficengine/models/block')
            ['concrete', 'cracked_asphalt', 'heavy_cracked_asphalt', 'light_asphalt', 'dark_asphalt', 'dirty_asphalt'].each { road ->
                def roadDir = new File(modelRoot, road)
                fileTree(roadDir).matching {
                    include '*.json', 'slope/*.json'
                }.each { stale ->
                    if (stale.name ==~ /\d+\.json/ || (stale.parentFile.name == 'slope' && stale.name ==~ /\d+_\d+\.json/)) {
                        stale.delete()
                    }
                }
            }
        }
        doLast {
            fileTree(destinationDir) {
                include '**/*.json', '**/*.mcmeta'
            }.each { resource ->
                // Compact build output only; preserve the readable source files.
                def parsed = new groovy.json.JsonSlurper().parseText(resource.getText('UTF-8'))
                def compact = groovy.json.JsonOutput.toJson(parsed)
                if (resource.path.replace('\\', '/').contains('/assets/trafficengine/blockstates/') && resource.name.contains('_pattern_')) {
                    compact = compact.replaceAll(/trafficengine:block\/(?:${sharedOverlayRoads})(\/(?:slope\/)?\d+(?:_\d+)?)/, 'trafficengine:block/asphalt$1')
                }
                resource.setText(compact, 'UTF-8')
            }
            // Copy tasks can retain files from older builds after source removal.
            ['assets/trafficengine/textures/gui/icons-old.png',
             'assets/trafficengine/textures/block/road_paint_solid.png',
             'assets/trafficengine/blockstates/blinker.json',
             'assets/trafficengine/models/block/blinker.json',
             'assets/trafficengine/models/item/blinker.json',
             'data/trafficengine/loot_tables/blocks/blinker.json'].each { removed ->
                new File(destinationDir, removed).delete()
            }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs += ['-Xmaxerrs', '1000']
    }
    tasks.withType(Javadoc).configureEach {
        failOnError = false
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

modBuildTools {
    publish {
        localRepoDir = "${System.getProperty('user.home')}/.m2/github/modsrepo/maven"
        publishCommon = false
    }
    javadoc {
        title = "Traffic Engine ${mod_version}"
        tags = [
                "apiNote:a:API Note:",
                "implNote:a:Impl Note:",
                "implSpec:a:Impl Spec:",
                "related:a:Related:",
                "example:a:Examples:",
                "side:a:Valid on side:"
        ]
    }
    allprojects {
        tasks.withType(Zip).configureEach {
            zip64 = true
            entryCompression = ZipEntryCompression.DEFLATED
        }
        tasks.withType(Jar).configureEach {
            zip64 = true
            entryCompression = ZipEntryCompression.DEFLATED
        }
    }
}
